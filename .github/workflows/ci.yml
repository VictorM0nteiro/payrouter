# ci.yml
# Pipeline de integração contínua do payrouter (GitHub Actions).
# Objetivo: a cada push na main, rodar lint e a suíte com -race, de modo que a regra de
# que o domínio não importa infraestrutura e os testes de concorrência sejam checados sempre.

name: ci

on:
  push:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.14.0

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test -race ./...
