# .golangci.yml
# Configuração do golangci-lint v2.
# Objetivo: além do lint padrão, tornar executável a regra inviolável do projeto:
# internal/domain/ não pode importar infraestrutura. Se importar, o CI falha.

version: "2"

linters:
  default: standard
  enable:
    - depguard
    - errorlint
    - bodyclose
  settings:
    depguard:
      rules:
        domain-puro:
          files:
            - "**/internal/domain/**"
          deny:
            - pkg: database/sql
              desc: o domínio não conhece banco
            - pkg: github.com/jackc/pgx
              desc: o domínio não conhece Postgres
            - pkg: net/http
              desc: o domínio não conhece HTTP
            - pkg: github.com/twmb/franz-go
              desc: o domínio não conhece Kafka
            - pkg: github.com/segmentio/kafka-go
              desc: o domínio não conhece Kafka
            - pkg: go.mongodb.org/mongo-driver
              desc: o domínio não conhece Mongo
            - pkg: github.com/redis/go-redis
              desc: o domínio não conhece Redis
        elastic-puro:
          files:
            - "**/internal/elastic/**"
          deny:
            - pkg: net/http
              desc: o pool elástico não conhece HTTP
            - pkg: database/sql
              desc: o pool elástico não conhece banco
            - pkg: github.com/jackc/pgx
              desc: o pool elástico não conhece Postgres
            - pkg: github.com/twmb/franz-go
              desc: o pool elástico não conhece Kafka
            - pkg: github.com/VictorM0nteiro/payrouter/internal/app
              desc: o pool elástico é genérico e não depende do núcleo
            - pkg: github.com/VictorM0nteiro/payrouter/internal/adapters
              desc: o pool elástico é genérico e não depende de adapters
            - pkg: github.com/VictorM0nteiro/payrouter/internal/metrics
              desc: as métricas se ligam por fora, via Stats e OnResize
