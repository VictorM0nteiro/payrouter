# docker-compose.yml
# Infraestrutura local do payrouter: PostgreSQL 16, as migrations, Redpanda (Kafka), a API,
# o relay do outbox, o processor, o participante simulado, o Prometheus e o Grafana. Mongo e
# Redis entram nas fases seguintes.
# Objetivo: `make env && make up` bastam para ter o sistema inteiro no ar, sem instalar nada.
# As portas de métricas (/metrics) dos binários não são publicadas no host: só o Prometheus as
# alcança, pela rede do compose. No host ficam o Prometheus (9099) e o Grafana (3000), os dois
# presos a 127.0.0.1.
# A ordem é garantida pelo compose: o Postgres fica saudável, as migrations rodam até o fim e
# só então a API sobe; o relay espera também o tópico existir.

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: payrouter
      POSTGRES_PASSWORD: payrouter
      POSTGRES_DB: payrouter
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payrouter -d payrouter"]
      interval: 2s
      timeout: 3s
      retries: 15

  # Roda uma vez e termina. Também serve a `docker compose run --rm migrate down -all`.
  migrate:
    image: migrate/migrate:v4.18.1
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./migrations:/migrations
    entrypoint:
      - migrate
      - -path=/migrations
      - -database=postgres://payrouter:payrouter@postgres:5432/payrouter?sslmode=disable
    command: ["up"]

  api:
    build: .
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgres://payrouter:payrouter@postgres:5432/payrouter?sslmode=disable
      # Vem do .env (veja `make env`). Sem ele o compose recusa subir, em vez de usar um
      # segredo conhecido.
      JWT_SECRET: "${JWT_SECRET:?JWT_SECRET ausente, rode make env}"
      API_RATE_RPS: ${API_RATE_RPS:-0}
      API_RATE_BURST: ${API_RATE_BURST:-0}
      LOG_FORMAT: ${LOG_FORMAT:-json}
    ports:
      - "8080:8080"
    # O shutdown da API espera as requisições em andamento por até 10 s; o compose precisa
    # esperar mais que isso antes de enviar SIGKILL.
    stop_grace_period: 15s
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/readyz"]
      interval: 3s
      timeout: 3s
      retries: 10

  # Broker compatível com Kafka (Redpanda), um nó só. Os serviços do compose falam por
  # redpanda:9092; da máquina local, o endereço é localhost:19092.
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v24.3.18
    command:
      - redpanda
      - start
      - --mode=dev-container
      - --smp=1
      - --memory=512M
      - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr=internal://redpanda:9092,external://localhost:19092
    ports:
      - "19092:19092"
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy:.*true'"]
      interval: 3s
      timeout: 5s
      retries: 20

  # Roda uma vez e termina: cria o tópico com 3 partições (a chave é o aggregate_id).
  kafka-init:
    image: docker.redpanda.com/redpandadata/redpanda:v24.3.18
    depends_on:
      redpanda:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - rpk -X brokers=redpanda:9092 topic create payrouter.instructions.events -p 3 || rpk -X brokers=redpanda:9092 topic describe payrouter.instructions.events

  # Publica o outbox no Kafka. Pode rodar mais de uma instância: SKIP LOCKED reparte as
  # linhas sem reordenar um agregado.
  relay:
    build: .
    entrypoint: ["relay"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      kafka-init:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgres://payrouter:payrouter@postgres:5432/payrouter?sslmode=disable
      KAFKA_BROKERS: redpanda:9092
      LOG_FORMAT: ${LOG_FORMAT:-json}
    # O relay termina a rodada em andamento ao receber SIGTERM; a rodada é curta.
    stop_grace_period: 15s

  # Consome InstructionAccepted do Kafka, envia ao participante e grava a resposta. Idempotente
  # pela versão do agregado: mais de uma instância não envia a mesma instrução duas vezes. Um
  # envio sem resposta (timeout) vira unknown, com a tarefa de conciliação; nunca é reenviado.
  processor:
    build: .
    entrypoint: ["processor"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      kafka-init:
        condition: service_completed_successfully
      participant:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://payrouter:payrouter@postgres:5432/payrouter?sslmode=disable
      KAFKA_BROKERS: redpanda:9092
      PARTICIPANT_URL: http://participant:9090
      PARTICIPANT_TIMEOUT: ${PARTICIPANT_TIMEOUT:-3s}
      RECONCILE_FIRST_DELAY: ${RECONCILE_FIRST_DELAY:-5s}
      RECONCILE_POLL: ${RECONCILE_POLL:-1s}
      RECONCILE_BACKOFF_BASE: ${RECONCILE_BACKOFF_BASE:-5s}
      RECONCILE_BACKOFF_MAX: ${RECONCILE_BACKOFF_MAX:-1m}
      RECONCILE_MAX_ATTEMPTS: ${RECONCILE_MAX_ATTEMPTS:-10}
      OUTPUT_TPS: ${OUTPUT_TPS:-0}
      OUTPUT_BURST: ${OUTPUT_BURST:-0}
      LOG_FORMAT: ${LOG_FORMAT:-json}
    restart: unless-stopped
    # Termina a mensagem em andamento ao receber SIGTERM; o envio tem prazo próprio.
    stop_grace_period: 15s

  # Participante simulado (a contraparte externa). PARTICIPANT_BEHAVIOR define o padrão
  # (accept, reject, slow, drop, late, crash); um prefixo no end_to_end_id ("late:abc") força o
  # comportamento de uma instrução. O restart devolve o serviço depois de um `crash`.
  participant:
    build: .
    entrypoint: ["participant"]
    environment:
      PARTICIPANT_BEHAVIOR: ${PARTICIPANT_BEHAVIOR:-accept}
      PARTICIPANT_TPS: ${PARTICIPANT_TPS:-0}
      PARTICIPANT_BURST: ${PARTICIPANT_BURST:-0}
      LOG_FORMAT: ${LOG_FORMAT:-json}
    ports:
      - "9090:9090"
    restart: unless-stopped
    stop_grace_period: 15s
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/healthz"]
      interval: 3s
      timeout: 3s
      retries: 10

  # Coleta as métricas dos binários e do Redpanda (veja deploy/prometheus/prometheus.yml). Só no
  # localhost: a porta 9090 do host já é do participante, por isso 9099.
  prometheus:
    image: prom/prometheus:v3.0.1
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      - api
      - relay
      - processor
      - participant
      - redpanda
    ports:
      - "127.0.0.1:9099:9090"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/-/ready"]
      interval: 3s
      timeout: 3s
      retries: 10

  # Dashboard provisionado (deploy/grafana). Senha só de desenvolvimento: usuário admin, senha
  # dev-grafana. Preso ao localhost.
  grafana:
    image: grafana/grafana:11.3.1
    environment:
      GF_SECURITY_ADMIN_PASSWORD: dev-grafana
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
  prometheus_data:
  grafana_data:
